<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Qora Web Server">
    <link rel="shortcut icon" href="favicon.ico">
    <title>Qora Blog</title>
    <link href="/index/libs/bootstrap/3/css/theme.css" rel="stylesheet">
    <link href="/index/libs/css/style.css" rel="stylesheet">
    <link href="/index/libs/css/sidebar.css" rel="stylesheet">
    <style type="text/css">
      .media:first-child {
      margin-top: 0;
      padding-left: 20px;
      padding-top: 20px;
      padding-right: 20px;
      }
      .media-object {
      height: 74px;
      }
      .media-heading {
      margin-top: 20px;
      margin-bottom: 5px;
      }
      p.post-header {
      padding-bottom: 0px !important;
      font-size: 15px;
      }
      p.post-content {
      padding-top: 0px !important;
      word-break: break-all;
      word-wrap: break-word;
      }
      body {
      padding-top: 50px;
      }
      .sub-header {
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      }
      .navbar-fixed-top {
      border: 0;
      z-index: 9999;
      }
      .sidebar {
      display: none;
      }
      @media (min-width: 768px) {
      .sidebar {
      position: fixed;
      top: 51px;
      bottom: 0;
      left: 0;
      z-index: 1000;
      display: block;
      padding: 20px;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: #f5f5f5;
      border-right: 1px solid #eee;
      }
      }
      .nav-sidebar {
      margin-right: -21px;
      margin-bottom: 20px;
      margin-left: -20px;
      }
      .nav-sidebar > li > a {
      padding-right: 20px;
      padding-left: 20px;
      }
      .nav-sidebar > .active > a,
      .nav-sidebar > .active > a:hover,
      .nav-sidebar > .active > a:focus {
      color: #fff;
      background-color: #428bca;
      }
      .main {
      padding-top: 0px;
      }
      .main-tabs {
      width: 100%;
      padding-top: 15px;
      padding-left: 0px;
      padding-right: 0px;
      background-color: lightgray;
      display: none;
      }
      img.logo-header {
      background-color: transparent;
      height: 100%;
      }
      .col-lg-8 {
      padding-left: 0px;
      }
      @media (min-width: 768px) {
      .main {
      padding-right: 40px;
      }
      }
      .main .page-header {
      margin-top: 0;
      }
      .placeholders {
      margin-bottom: 30px;
      text-align: center;
      }
      .placeholders h4 {
      margin-bottom: 0;
      }
      .placeholder {
      margin-bottom: 20px;
      }
      .placeholder img {
      display: inline-block;
      border-radius: 50%;
      }
      .r-t {
      margin: 0px;
      }
      .r-l {
      margin: 0px;
      }
      span.label.label-default {
      background-color: #fff;
      color: lightgray;
      font-size: 90%;
      line-height: 1;
      }
      span.label.label-default a {
      color: #ddd;
      text-decoration: none;
      }
      a.r-l:hover,
      a.r-l:focus {
      color: #6467FF;
      text-decoration: none;
      }
      .navbar-header {
      width: 110px;
      }
      .modal-dialog.modal-lg {
      padding-top: 100px;
      }
      .modal-content {
      height: 620px;
      /*width: 700px;*/
      }
      .tl-profile {
      border: 1px solid #ddd;
      -webkit-box-shadow: 0 1px 6px rgba(0, 0, 0, 0.175);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.175);
      margin-top: 40px;
      }
      .tl-profile img.tl-image-lg{
      z-index: 0;
      width: 100%;
      margin-bottom: 10px;
      }
      .tl-image-profile
      {
      margin: -90px 10px 0px 50px;
      z-index: 9;
      width: 21%;
      margin-bottom: 20px;
      }
      @media (max-width:768px)
      {
      .tl-profile-text>h1{
      font-weight: 700;
      font-size:16px;
      }
      .tl-image-profile
      {
      margin: -45px 10px 0px 25px;
      z-index: 9;
      width: 20%;
      }
      }
      .profile-options
      {
      width:100%;
      font-size: 20px;
      }
      .co-tabs {
      border-bottom: 3px solid #6467ff;
      margin-right: 10px;
      }
      ul.co-lists.list-unstyled {
      text-align: center;
      }
      li.co-top {
      font-size: 10px;
      }
      li.co-bottom {
      font-size: 15px;
      }
      .po-tabs
      {
      border: 1px solid #ddd;
      }
      li.po-tabs a
      {
      color: #ddd;
      }
      li.po-tabs a:hover
      {
      color: #6467ff;
      text-decoration: none;
      }
      #apimessage {
      position: fixed;
      top: 0px;
      left: 0px;
      width: 100%;
      z-index: 9999;
      }
      span.glyphicon.glyphicon-edit {
      font-size: 17px;
      top: -2px;
      left: -6px;
      }
      button.btn.btn-lg.btn-primary {
      height: 37px;
      width: 37px;
      }
      .modal-dialog.modal-lg {
      top: -50px;
      }
      .menu-grid span.glyphicon.glyphicon-edit {
      left: 2px;
      }
      .btn-group.post-actions {
      display: flex;
      }
      .blog-posts-container {
      margin-bottom: 32px;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
      }
      .blog-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
      }
      .blog-post-card {
      background: #fff;
      border: 1px solid #e8e8ec;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .blog-post-card:hover {
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.1);
      border-color: #dcdce8;
      }
      .blog-post-card--highlighted {
      border-color: #6467FF;
      box-shadow: 0 0 0 2px rgba(100, 103, 255, 0.25);
      }
      .blog-post-card__head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px 0;
      }
      .blog-post-card__avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #eee;
      }
      .blog-post-card__meta {
      flex: 1;
      min-width: 0;
      }
      .blog-post-card__meta h2 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      line-height: 1.35;
      }
      .blog-post-card__meta .blog-post-card__time {
      font-size: 12px;
      color: #6b7280;
      }
      .blog-post-card__shareline {
      font-size: 12px;
      color: #4b5563;
      padding: 0 20px 8px;
      }
      .blog-post-card__body {
      padding: 4px 20px 16px;
      }
      .blog-post-card__body .post-header {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      }
      .blog-post-card__body .post-header a {
      color: #111827;
      text-decoration: none;
      }
      .blog-post-card__body .post-header a:hover {
      color: #6467FF;
      }
      .blog-post-card__body .post-content {
      font-size: 15px;
      line-height: 1.55;
      color: #374151;
      margin: 0;
      word-break: break-word;
      }
      .blog-post-card__footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 20px;
      background: #fafbfc;
      border-top: 1px solid #f0f0f4;
      justify-content: space-between;
      }
      .blog-post-card__comments {
      padding: 0 20px 16px;
      background: #fafbfc;
      border-top: 1px solid #f0f0f4;
      }
      .blog-post-card__comments .commentEntry {
      padding: 12px 0;
      border-bottom: 1px solid #ececf2;
      }
      .blog-post-card__comments .commentEntry:last-child {
      border-bottom: 0;
      }
      .blog-pagination-nav {
      clear: both;
      padding: 24px 0 12px;
      text-align: center;
      margin-top: 8px;
      }
      .blog-pagination-meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      }
      .blog-pagination-inner {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      }
      .blog-pagination-inner .blog-pagination-btn {
      min-width: 120px;
      margin: 0;
      border-color: #d1d5db;
      color: #374151;
      border-radius: 8px;
      font-weight: 500;
      }
      .blog-pagination-inner a.blog-pagination-btn:hover,
      .blog-pagination-inner a.blog-pagination-btn:focus {
      border-color: #6467FF;
      color: #6467FF;
      background-color: #fff;
      text-decoration: none;
      }
      .blog-post-card .media:first-child {
      margin-top: 0;
      padding-left: 0;
      padding-top: 0;
      padding-right: 0;
      }
  </head>
  <body>
    <div id="PostModal" class="modal fade">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <iframe width="100%" height="100%" frameborder="0" src="postblog.html?blogname={{blogname|escape(strategy="url_param")}}"></iframe>
        </div>
      </div>
    </div>
	<div id="commentModal" class="modal fade">
	  <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <iframe id=commentIframe width="100%" height="100%" frameborder="0" src="#"></iframe>
        </div>
      </div>
    </div>
    {{navbar}}
    <div class="container">
      <div class="row">
        <div class="main">
        {% autoescape true%}
          {% if blogprofile is not empty %}
         	{%if blogprofile.getProfileGraphicOpt() is empty%}
          <div class="tl-profile"><img align="left" src="/index/img/banner_01.png" alt="" class="tl-image-lg">
          {%else%}
          <div class="tl-profile"><img align="left" src="{{blogprofile.getProfileGraphicOpt()}}" alt="" class="tl-image-lg">
          {%endif%}

          {% if blogprofile.getAvatarOpt() is empty%}
            <img align="left" src="/index/img/qora-user.png" alt="" class="tl-image-profile thumbnail">
          {%else%}
            <img align="left" src="{{blogprofile.getAvatarOpt()}}" alt="" class="tl-image-profile thumbnail">
            {%endif%}
            <div class="tl-profile-text">
              <h1>{{blogname}}</h1>
              <ul class="profile-options list-inline">&nbsp;&nbsp;
                <li class="co-tabs pull-left"><ul class="co-lists list-unstyled"><li class="co-top translate">Followers</li><li class="co-bottom">{{ follower.size() }}</li></ul></li>
                <li class="co-tabs pull-left"><ul class="co-lists list-unstyled"><li class="co-top translate">Following</li><li class="co-bottom">{{ blogprofile.getFollowedBlogs().size() }}</li></ul></li>
          		{% if blogprofile is not empty and  blogprofile.isBlogEnabled()%}
              <li class="po-tabs pull-right"><a><span style='cursor: pointer;' onclick="javascript:processfollow()">{%if isFollowing%}<span class="translate">Unfollow</span> {%else%}<span class="translate">Follow</span> {%endif%}<div id="divFollow" class="glyphicon glyphicon-user"{%if isFollowing%}style="color: #6467FF;"{%else%}{%endif%}></div> <span id=profFollower>
			  </span></span></a></li>
              {%endif%}
              </ul>
            </div>
          </div>
          {% endif %}
           {% endautoescape %}
          {{apimessage}} <div id=apimessage></div>
          {% if blogenabled %}
          <div style="display:none;"><textarea id="clipboard_textarea" name="clipboard_textarea">hello</textarea></div>
          <div id="blog-posts-container" class="blog-posts-container">
          <div class="blog-feed">{% for blogpost in blogposts %}
            <article id="{{blogpost.getSignature()}}" class="blog-post-card">
              <div class="blog-post-card__head">
                    {% if blogpost.getProfileOpt() is not null and blogpost.getProfileOpt().isProfileEnabled() %}
                    <a href="/index/blog.html?blogname={{blogpost.nameOrCreator|escape(strategy="url_param")}}"><img src="{{blogpost.getAvatar()}}" alt="" class="blog-post-card__avatar"></a>
                    {%else%}
                    <img src="{{blogpost.getAvatar()}}" alt="" class="blog-post-card__avatar">
                    {%endif%}
                    <div class="blog-post-card__meta">
                    	{% if blogpost.getProfileOpt() is not null and blogpost.getProfileOpt().isProfileEnabled() %}
                      <h2><a href="/index/blog.html?blogname={{blogpost.getProfileOpt().getName().getName()|escape(strategy="url_param")}}">{{blogpost.nameOrCreator}}</a></h2>
                    	{%else%}
                      <h2>{{blogpost.nameOrCreator}}</h2>
                    	{%endif%}
                      <div class="blog-post-card__time"><i rel="tooltip" title="{{blogpost.creationTime}}" class="glyphicon glyphicon-time"></i> {{blogpost.creationTime}}</div>
                    </div>
                    <div class="media-right">
                      <div class="btn-group post-actions">
                        <a class="btn btn-default btn-sm" href="/index/showpost.html?msg={{blogpost.getSignature()}}">
                          <i class="glyphicon glyphicon-link"></i>
                        </a>
                        {% if blogpost.getShareSignatureOpt() is not null%}
                          <button class ="btn btn-default btn-sm" onclick="javascript:processDelete('{{blogpost.getShareSignatureOpt()}}')" >
                            <i class="glyphicon glyphicon-trash" style=""></i>
                          </button>
                        {% else%}
                          <button class ="btn btn-default btn-sm" onclick="javascript:processDelete('{{blogpost.getSignature()}}')" >
                            <i class="glyphicon glyphicon-trash" style=""></i>
                          </button>
                          {% endif%}
                      </div>
                  </div>
              </div>
                  	{% if blogpost.shareAuthorOpt() is not null %}
              <div class="blog-post-card__shareline">
                  	{% if blogpost.getNameOpt() is not null %}
                  	<span class="glyphicon glyphicon-retweet"></span>  <b><a href="/index/blog.html?blogname={{blogpost.shareAuthorOpt()|escape(strategy="url_param")}}">{{blogpost.shareAuthorOpt()}}</a></b> shared <b><a href="/index/blog.html?blogname={{blogpost.nameOrCreator|escape(strategy="url_param")}}">{{blogpost.nameOrCreator}}</a></b> post
                  	{%else%}
                  	<span class="glyphicon glyphicon-retweet"></span>  <b><a href="/index/blog.html?blogname={{blogpost.shareAuthorOpt()|escape(strategy="url_param")}}">{{blogpost.shareAuthorOpt()}}</a></b> shared <b>{{blogpost.nameOrCreator}}</b> post
                  	{%endif%}
              </div>
                  	{%endif%}
                <div class="blog-post-card__body">
                  <a href="/index/showpost.html?msg={{blogpost.getSignature()}}"><p class="post-header"><b>{{blogpost.titleOpt}}</b></a></p>
                  <p class="post-content">{{blogpost.description}}</p>
                </div>
                <div class="blog-post-card__footer">
                  <a class="btn btn-link btn-sm" style="padding-left:0;color:#6467FF;"><span onclick="javascript:processLike('{{blogpost.getSignature()}}', {{blogpost.isLiking()}})" ><i class="glyphicon glyphicon-heart"></i> {{blogpost.getLikes()}}</span></a>
                  <a class="btn btn-link btn-sm" style="padding-right:0;color:#6467FF;"><span onclick="javascript:processShare('{{blogpost.getSignature()}}' , '{{blogpost.getBlognameOpt()|escape(strategy="js")}}')" ><i class="glyphicon glyphicon-share"></i> {{blogpost.getShares()}}</span></a>
                </div>
				   <div class="blog-post-card__comments commentList">
                   {% for comment in blogpost.getComments() %}
                    <div class="commentEntry media">
					<div class="media-left">
					{% if comment.getNameOpt() is not null %}
                      <a href="/index/blog.html?blogname={{comment.nameOrCreator|escape(strategy="url_param")}}">
                      {%else%}
                      <a href="#">
                  	{%endif%}
                     {%if comment.getAvatar() is empty%}
                        <img class="media-object commenterImage" src="/index/img/qora-user.png" alt="user image">
          			{%else%}
                        <img class="media-object commenterImage" src="{{comment.getAvatar()}}" alt="user image">
          			{%endif%}
                      </a>
					</div>
					<div class="media-body">
                      {% if comment.getNameOpt() is not null %}
						<h4 class="media-heading Commenter"><a href="/index/blog.html?blogname={{comment.nameOrCreator|escape(strategy="url_param")}}">{{comment.nameOrCreator}}</a></h4>
          			{%else%}
						<h4 class="media-heading Commenter">{{comment.nameOrCreator}}</h4>
          			{%endif%}
          				 {% if comment.getTitleOpt() is not null %}
                        <b><p class="commentText">{{comment.titleOpt}}</p></b>
                        {%endif%}
                        <p class="commentText">{{comment.description}}</p>
                        <span class="date sub-text">{{comment.creationTime}}</span>
					</div>
					<div class="media-right">
						<button class ="btn btn-default btn-sm" onclick="javascript:processCommentDelete('{{comment.getSignature()}}')" >
							<i class="glyphicon glyphicon-trash" style=""></i>
						</button>
					</div>
					</div>
                {% endfor %}
                {%if blogprofile is empty or blogprofile.isCommentingAllowed() %}
                    <form class="form-inline" role="form" style="padding-top:8px;">
                      <div class="form-group">
                        <a style="cursor: pointer; color:#6467FF;" onclick="javascript:showCommentForm('{{blogpost.getSignature()}}');" class="translate">Comment</a>
                      </div>
                    </form>
                {%endif%}
                </div>
            </article>			{% endfor %}
          </div>
          {% if blogPaginationTotalPages > 1 %}
          <nav id="blog-pagination-nav" class="blog-pagination-nav" aria-label="Blog posts pagination">
            <div class="blog-pagination-meta"><span class="translate">Page</span> {{ blogPaginationPage }} / {{ blogPaginationTotalPages }} <span class="translate">of</span> {{ blogPaginationTotalCount }} <span class="translate">posts</span></div>
            <div class="blog-pagination-inner">
              {% if blogPaginationHasPrev %}
              <a class="btn btn-default blog-pagination-btn" href="{{ blogPaginationPrevUrl }}"><span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span> <span class="translate">Previous</span></a>
              {% else %}
              <span class="btn btn-default blog-pagination-btn disabled"><span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span> <span class="translate">Previous</span></span>
              {% endif %}
              {% if blogPaginationHasNext %}
              <a class="btn btn-default blog-pagination-btn" href="{{ blogPaginationNextUrl }}"><span class="translate">Next</span> <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span></a>
              {% else %}
              <span class="btn btn-default blog-pagination-btn disabled"><span class="translate">Next</span> <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span></span>
              {% endif %}
            </div>
          </nav>
          {% endif %}
          </div>
          {%else%}
          <ul class="timeline">
             <h1 style="font-family: Verdana;"><span class="translate">This blog is currently disabled.</span><br>
             {% if ownProfileName is not null %}
        	<span class="translate">You can enable the blog <a href='/index/settings.html?profilename={{ownProfileName|escape(strategy="url_param")}}'>here</a></span>
        	{%endif%}
      		</h1><br>
            <li class="clearfix"></li>
          </ul>
            {% endif %}
        </div>
      </div>
    </div>
  </div>
    <script type="text/javascript">

		var profileisFollowing;
		{% if isFollowing %}
		profileisFollowing = true;
		{% else %}
		profileisFollowing = false;
		{%  endif %}

       function getParameter(name) {
        if (name = (new RegExp('[?&]' + encodeURIComponent(name) + '=([^&]*)')).exec(location.search))
            return decodeURIComponent(name[1]);
    	}

		function parseError(error) {
			try {
				var error = JSON.parse(error);
				message = error.message;
			} catch (e) {
				message = error;
			}
			return message;
		}
					
    	function processfollow() {
			var  blogname;
			var follow = !profileisFollowing;
			blogname = getParameter('blogname');

      // $("#apimessage").fadeTo(2500, 500).slideUp(1000, function(){
      //     $("#apimessage").alert('close');
      // });
			if (!blogname) {
				$("#apimessage").html("<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>"
								+ Lang.getInstance().translate("You can't follow the Mainblog")
								+ "<br>"
								+ "</div></center>");
				return 0;
			}

			{% if activeProfile is null %}
				$("#apimessage").html("<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>"
								+ Lang.getInstance().translate("This feature can only be used with an active profile.\nPlease choose a Profile first!")
								+ "</div></center>");
				return 0;
			{%  endif %}

			$.post(
			"/index/followblog.html",
			{
				blogname: blogname,
				follow: follow
			}).done( function(data) {
				if(data.type == 'youAlreadyFollowThisBlog'){
					$("#apimessage").html("<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>" 
										+ Lang.getInstance().translate("Blog follow not successful<br>You already follow this blog")
										+ "</div></center>");
				} else if (data.type == 'youCantFollowYourOwnProfiles'){
					$("#apimessage").html("<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>" 
										+ Lang.getInstance().translate("Blog follow not successful<br>You can't follow your own profiles")
										+ "</div></center>");
				} else if (data.type == 'YouFollowThisBlogNow'){
					$("#apimessage").html("<div class=\"alert alert-dismissible alert-success\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>" 
										+ Lang.getInstance().translate("You follow this blog now")
										+ "<br>"
										+ "</div>");
				} else if (data.type == 'BlogFollowNotSuccessful'){
					$("#apimessage").html("<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>" 
										+ Lang.getInstance().translate("Blog follow not successful")
										+ "<br>"
										+ parseError(data.result)
										+ "</div></center>");
				} else if (data.type == 'unfollowSuccessful'){
					$("#apimessage").html("<div class=\"alert alert-dismissible alert-success\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>" 
										+ Lang.getInstance().translate("Unfollow successful")
										+ "<br>"
										+ "</div>");
				} else if (data.type == 'blogUnfollowNotSuccessful'){
					$("#apimessage").html("<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>" 
										+ Lang.getInstance().translate("Blog unfollow not successful")
										+ "<br>"
										+ parseError(data.result)
										+ "</div></center>");
				}

				if(data.hasOwnProperty('follower'))

						message = data.result;

					$("#apimessage").html('<center><div class=\"alert alert-dismissible alert-danger\" role=\"alert\"><button type=\"button\" class=\"close\" data-dismiss=\"alert\">×</button>'

    transformToAssocArray = function(prmstr) {
        var i, params, prmarr, tmparr;
        params = {};
        prmarr = prmstr.split('&');
        i = 0;
        while (i < prmarr.length) {
            tmparr = prmarr[i].split('=');
            params[tmparr[0]] = tmparr[1];
            i++;
        }
        return params;
    };
    var getSearchParameters;
    getSearchParameters = function() {
        var prmstr;
        prmstr = decodeURIComponent(window.location.search.substr(1));
        if (prmstr != null && prmstr != '') {
            return transformToAssocArray(prmstr);
        } else {
            return {};
        }
    };
